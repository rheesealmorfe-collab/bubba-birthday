<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Bubba ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 15% 20%, #ffffff 0 4px, transparent 5px),
                radial-gradient(circle at 80% 15%, #ffffff 0 3px, transparent 4px),
                linear-gradient(135deg, #fff5f6, #ffe1ea, #e5f2ff);

            background-size: 120px 120px, 170px 170px, cover;

            font-family: "Quicksand", sans-serif;
            color: #684d55;

            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .small-text {
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a67c86;
            margin-bottom: 8px;
        }

        h1 {
            font-family: "Cherry Bomb One", cursive;
            font-size: clamp(55px, 15vw, 100px);
            color: #ee7896;
            margin: 0;
            line-height: 1;
            text-shadow: 3px 4px 0 #ffd1dc;
        }

        .message {
            font-size: 17px;
            margin: 18px auto 30px;
            max-width: 400px;
            line-height: 1.6;
        }

        /* ENVELOPE */

        .envelope-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 190px;

            background: #f394ad;

            border-radius: 10px;

            box-shadow:
                0 18px 35px rgba(139, 82, 99, 0.18);

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            overflow: hidden;
        }

        .envelope:hover {
            transform: translateY(-8px) rotate(-1deg);
            box-shadow:
                0 25px 45px rgba(139, 82, 99, 0.23);
        }

        /* Envelope lower folds */

        .envelope::before {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 105px solid #e97f9b;

            z-index: 2;
        }

        /* Envelope flap */

        .flap {
            position: absolute;

            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 105px solid #ffb7c8;

            z-index: 4;

            transition: transform 0.7s ease;
            transform-origin: top;
        }

        /* Heart seal */

        .seal {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 62px;
            height: 62px;

            border-radius: 50%;

            background: #fff5f0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;

            color: #ed7694;

            box-shadow: 0 5px 15px rgba(120, 70, 85, 0.15);

            z-index: 5;

            transition: 0.5s ease;
        }

        .envelope:hover .seal {
            transform: translate(-50%, -50%) scale(1.1) rotate(5deg);
        }

        .hint {
            margin-top: 22px;

            font-size: 14px;
            font-weight: 700;

            color: #96717b;

            animation: bounce 1.8s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* LITTLE DECORATIONS */

        .decoration {
            position: fixed;
            pointer-events: none;
            user-select: none;
        }

        .heart1 {
            top: 12%;
            left: 9%;
            font-size: 30px;
            color: #f49ab0;
            transform: rotate(-15deg);
        }

        .heart2 {
            bottom: 15%;
            right: 10%;
            font-size: 25px;
            color: #9bc5e9;
            transform: rotate(15deg);
        }

        .star1 {
            top: 20%;
            right: 13%;
            font-size: 25px;
            color: #f2c86b;
        }

        .cloud {
            bottom: 12%;
            left: 10%;
            font-size: 38px;
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .envelope {
                width: 270px;
                height: 170px;
            }

            .envelope::before {
                border-left-width: 135px;
                border-right-width: 135px;
            }

            .flap {
                border-left-width: 135px;
                border-right-width: 135px;
            }

            h1 {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>

    <!-- Decorations -->
    <div class="decoration heart1">♡</div>
    <div class="decoration heart2">♡</div>
    <div class="decoration star1">✦</div>
    <div class="decoration cloud">☁︎</div>


    <div class="container">

        <div class="small-text">
            a little something
        </div>

        <h1>
            for Bubba ♡
        </h1>

        <p class="message">
            I made a tiny little corner of the internet
            just for you.
        </p>


        <div class="envelope-wrapper">

            <div class="envelope" onclick="openEnvelope()">

                <div class="flap"></div>

                <div class="seal">
                    ♡
                </div>

            </div>

        </div>


        <p class="hint">
            tap the envelope to open ♡
        </p>

    </div>


    <script>

        function openEnvelope() {

            const envelope =
                document.querySelector(".envelope");

            const flap =
                document.querySelector(".flap");

            const seal =
                document.querySelector(".seal");

            flap.style.transform =
                "rotateX(180deg)";

            seal.style.opacity = "0";

            setTimeout(() => {

                alert("There's something waiting for you, Bubba ♡");

            }, 700);

        }

    </script>

</body>
</html>
